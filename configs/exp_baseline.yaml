# configs/exp_baseline.yaml
# Configuration for BTP RL Topology Optimization experiments

mesh:
  nelx: 30
  nely: 10
  volfrac: 0.4
  rmin: 1.5

material:
  E0: 1.0
  Emin: 1.0e-9
  nu: 0.3
  p: 3.0

env:
  delta_max: 0.05
  max_steps: 30
  project_volume: true
  lam_v: 10.0
  beta: 0.0
  filter_type: "density"
  channels: 4

ppo:
  learning_rate: 3.0e-4
  n_steps: 128
  batch_size: 64
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  total_timesteps: 5000

training:
  seed: 42
  eval_freq: 500
  checkpoint_dir: "results/checkpoints"
  log_dir: "results/logs"
