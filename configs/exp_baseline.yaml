# configs/exp_baseline.yaml
# Reference copy of the settings used for the results in results/.
# The scripts do NOT read this file: the values used are defined in
# src/common.py (BASE_CONFIG, REWARDS, ALPHA, PPO_MODES) and src/train.py.
# Keep this file in sync with those when changing a setting.

mesh:
  nelx: 30
  nely: 10
  volfrac: 0.4
  rmin: 1.5

material:
  E0: 1.0
  Emin: 1.0e-9
  nu: 0.3
  p: 3.0

env:
  delta_max: 0.05
  max_steps: 30
  project_volume: true
  # Weighted multi-factor reward:
  #   R_t = w_stiff*F_stiffness + w_weight*F_weight + w_gray*F_grayness
  #       + w_smooth*F_smoothness + w_term*F_terminal, clipped to [-reward_clip, reward_clip]
  # These values reproduce the audited Stage 3/4 reward (residual PPO C = 441.88 +/- 1.79).
  # Suggested ablation values: w_gray 0.05..0.2, w_smooth 0.01, w_term 1.0.
  w_stiff: 1.0
  w_weight: 10.0          # replaces lam_v; ~0 effect while project_volume is true
  weight_penalty: "abs"   # "abs": -|V-V*|, "sq_rel": -((V-V*)/V*)^2
  w_gray: 0.0
  w_smooth: 0.0
  w_term: 0.0             # replaces beta
  reward_clip: 2.0
  filter_type: "density"
  channels: 4

residual:
  alpha: 0.2              # scale of the learned correction (src/common.py ALPHA)

ppo:                      # src/train.py and src/common.py PPO_MODES
  policy: "MLP [128, 128] actor and critic"
  n_steps: 256
  batch_size: 64
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001
  standard:
    learning_rate: 3.0e-4
    log_std_init: -1.5
    total_timesteps: 50000
  residual:
    learning_rate: 1.0e-4
    log_std_init: -2.0
    total_timesteps: 30000

training:
  seeds: [42, 43, 44]
  checkpoint_dir: "results/checkpoints"
